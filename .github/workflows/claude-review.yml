name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review cette PR. Règles du repo : CLAUDE.md (sections "Règles game dev", "Ce qu'il ne faut pas faire") et docs/architecture.md (lis-les avec `./mdx`).
            Vérifie, dans cet ordre :
            1. Bugs et erreurs de logique.
            2. Respect de l'architecture : état de jeu modifié uniquement côté serveur, aucune logique de jeu dans engine/, data d'abord, réplication minimale.
            3. Over-engineering et code réinventé (Bevy, replicon, egui ou le moteur le font déjà).
            4. Critères d'acceptation de l'issue liée (`Closes #n`) couverts.
            5. Doc et INDEX.md à jour si le comportement ou l'API change.
            Commentaires inline pour les problèmes localisés, puis un seul commentaire de synthèse via `gh pr comment`.
            En français, concis, pas de compliments. Si rien à signaler : "RAS".
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(./mdx:*)"'
